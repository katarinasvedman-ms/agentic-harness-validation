<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Harness Validation Architecture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f8fafc;
      --ink: #172033;
      --muted: #53657d;
      --soft: #74839a;
      --rule: rgba(23, 32, 51, 0.13);
      --accent: #0078d4;
      --accent-tint: rgba(0, 120, 212, 0.09);
      --link: #2563eb;
      --font-sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .frame { width: min(1280px, 100%); }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 600 11px/1 var(--font-mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 20px;
      color: var(--ink);
      font: 600 clamp(30px, 4vw, 44px)/1.05 var(--font-sans);
      letter-spacing: -0.035em;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 980px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 10px;
    }
  </style>
</head>
<body>
